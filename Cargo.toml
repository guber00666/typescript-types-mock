[package]
name = "typescript-types-mock"
version = "1.0.6"
edition = "2021"

[lib]
path = "rust/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["node"]
node = ["napi", "napi-derive", "walkdir"]
wasm = ["wasm-bindgen", "js-sys", "serde-wasm-bindgen", "getrandom/js"]

[dependencies]
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"

# Node.js native bindings
napi = { version = "2", features = ["napi6", "serde-json"], optional = true }
napi-derive = { version = "2", optional = true }

# WASM support
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

# TypeScript parsing (fastest TS parser)
swc_common = { version = "0.36", default-features = false }
swc_ecma_parser = "0.148"
swc_ecma_ast = "0.117"
swc_ecma_visit = "0.103"

# File I/O (Node.js only)
walkdir = { version = "2", optional = true }

# Random number generation
rand = "0.8"
getrandom = "0.2"

# Date/time handling
chrono = "0.4"

[build-dependencies]
napi-build = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
