[package]
name = "typescript-types-mock"
version = "1.0.2"
edition = "2021"

[lib]
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6", "serde-json"] }
napi-derive = "2"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"

# TypeScript parsing (fastest TS parser)
swc_common = { version = "0.36", features = ["tty-emitter"] }
swc_ecma_parser = "0.148"
swc_ecma_ast = "0.117"
swc_ecma_visit = "0.103"

# File I/O
walkdir = "2"

# Random number generation
rand = "0.8"

# Date/time handling
chrono = "0.4"

[build-dependencies]
napi-build = "2"
